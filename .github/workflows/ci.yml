name: NTSA-X verified throughput
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ntsa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m compileall -q ntsa_x examples tests
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Native agent workbench safety and tool protocol
        run: python -m unittest discover -s tests -p 'test_agent_workbench.py' -v
      - name: Bounded mission controller, approvals, observations and failure tests
        run: python -m unittest discover -s tests -p 'test_agent_mission.py' -v
      - name: Accelerated curriculum, independent exams and safe export
        run: python -m unittest discover -s tests -p 'test_academy.py' -v
      - name: Existing orbital demo
        run: python -m examples.demo_orbit
      - name: Paired orbit Nexus + Materializer smoke test
        run: python -m examples.demo_counter_orbit
      - name: Indexed convergence and fixed-worker smoke test
        run: python -m examples.demo_milestone03

  factory-benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 100-item factory run and measured sequential comparison
        run: python -m examples.benchmark_factory --tasks 100 --workers 8 --compare --output factory-bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: factory-throughput-${{ matrix.os }}-${{ github.run_id }}
          path: factory-bench.json
          retention-days: 14
          if-no-files-found: error

  persistent-benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare Persistent Scalar vs one-shot workers
        run: python -m examples.benchmark_persistent_scalar --tasks 100 --workers 1,4,8,16 --repeats 2 --output persistent-scalar-bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: persistent-scalar-${{ matrix.os }}-${{ github.run_id }}
          path: persistent-scalar-bench.json
          retention-days: 14
          if-no-files-found: error


  native-state-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.6,<3"
      - name: Trainable recurrent state + checkpoint regression
        run: python -m unittest discover -s tests -p 'test_native_model.py' -v
      - name: COG-FU joint cognition and diffusion integration tests
        run: python -m unittest discover -s tests -p 'test_cog_fu.py' -v
      - name: COG-FU language acquisition, rights and ablation tests
        run: python -m unittest discover -s tests -p 'test_cog_fu_language.py' -v
      - name: Compare COG-FU recurrent/diffusion decode and detect repetition collapse
        run: python -m unittest discover -s tests -p 'test_cog_fu_diagnose.py' -v
      - name: Verify existing test suite with PyTorch available
        run: python -m unittest discover -s tests -v

  verified-gate:
    needs: [test, factory-benchmark, persistent-benchmark, native-state-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce test and benchmark job outcomes
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BENCH_RESULT: ${{ needs.factory-benchmark.result }}
          PERSISTENT_RESULT: ${{ needs.persistent-benchmark.result }}
          NATIVE_RESULT: ${{ needs.native-state-smoke.result }}
        shell: bash
        run: |
          test "$TEST_RESULT" = "success"
          test "$BENCH_RESULT" = "success"
          test "$PERSISTENT_RESULT" = "success"
          test "$NATIVE_RESULT" = "success"
